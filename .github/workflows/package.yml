name: Build packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true

jobs:

  build:

    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    env:
      TAG: ${{ inputs.tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read packaging revisions
        run: |
          for type in deb rpm; do
            revision=$(jq -er --arg tag "$TAG" --arg type "$type" \
              '.[$tag][$type] // 1' build/revisions.json)
            echo "${type^^}_REVISION=$revision" >> "$GITHUB_ENV"
          done

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/fpm:latest
          docker tag ghcr.io/${{ github.repository_owner }}/fpm:latest fpm

      - name: Render changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate 'repos/${{ github.repository_owner }}/relay/releases?per_page=100' \
            | jq -s 'add' > /tmp/releases.json
          ./build/changelog.sh /tmp/releases.json "$TAG" build/changelog

      - name: Bundle packages
        run: |
          cd build
          # /repo holds LFS pointers only; fpm.sh skips packages by filename
          docker run --tty \
            -v "${PWD}:/root/build" \
            -v "${PWD}/..:/repo:ro" \
            -e DEB_REVISION -e RPM_REVISION \
            fpm /bin/bash ./fpm.sh "$TAG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/dist/*
